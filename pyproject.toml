[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlrecorder"
version = "0.1.1"
description = "Python wrapper for MLRecorder process-audio capture DLL on Windows"
readme = "python/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Marco Antonio Molina Leija", email = "marcoleija@marco-ml.com" }
]
maintainers = [
  { name = "Marco Antonio Molina Leija", email = "marcoleija@marco-ml.com" }
]
keywords = [
  "audio",
  "recording",
  "wasapi",
  "windows",
  "loopback",
  "python",
  "ctypes"
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/marcomolinaleija/mlrecorder"
Repository = "https://github.com/marcomolinaleija/mlrecorder"
Issues = "https://github.com/marcomolinaleija/mlrecorder/issues"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "python" }
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["mlrecorder*"]

[tool.setuptools.package-data]
mlrecorder = ["bin/*.dll"]
